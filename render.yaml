# Alternativa de publicacao com processo continuo.
#
# Por que existe: na Vercel o backend roda como funcao, e no plano Hobby o cron
# executa uma vez por dia - a reconciliacao que abre e fecha as aulas ficaria
# parada entre as execucoes. Aqui o processo fica de pe e o loop interno roda a
# cada TICK_DASHBOARD_S, como em desenvolvimento.
#
# Uso: no Render, New > Blueprint, apontando para este repositorio.
# As variaveis marcadas sync:false sao preenchidas no painel, nunca aqui.

services:
  - type: web
    name: insted-backend
    runtime: python
    region: virginia
    plan: free
    rootDir: apps/backend-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      # Fixada de proposito. Boa parte do tempo perdido na Vercel foi por
      # diferenca silenciosa de ambiente: o que roda aqui tem que ser o que
      # roda la.
      - key: PYTHON_VERSION
        value: "3.12.7"

      # A grade e hora de parede local; sem isso o servidor procuraria as
      # aulas no fuso dele.
      - key: TIMEZONE
        value: America/Campo_Grande

      # Processo continuo: o loop interno cuida da reconciliacao.
      - key: LOOP_INTERNO
        value: "true"

      # As catracas reais estao ligadas desde 24/09/2026: o job no SQL Server
      # replica para catraca.gac_marcacao e o backend le de la.
      #
      # Nao e so "parar de inventar passagem". Este flag ESCOLHE a fonte: com
      # ele ligado o alimentador das catracas nem chega a subir (main.py), e o
      # painel mostra campus vazio com o espelho cheio - foi exatamente o que
      # aconteceu, e custou caro para achar, porque o simulador fora do horario
      # de aula tambem nao gera nada e o processo parecia apenas ocioso.
      - key: SIMULADOR_ATIVO
        value: "false"

      # Preenchidos no painel do Render (Environment), nunca no repositorio.
      # CORS_ORIGINS precisa listar o dominio do painel na Vercel, senao o
      # navegador barra as chamadas mesmo com a API de pe.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false

      # Opcional: so e necessario com mais de uma instancia.
      - key: REDIS_URL
        sync: false

      # Envio do codigo de redefinicao de senha. Sem isto o recurso nao se
      # anuncia: /auth/config devolve reset_por_email:false e o painel esconde
      # o "Esqueci minha senha", em vez de oferecer um caminho que morre na
      # ultima tela. O acesso pelo terminal (redefinir_senha.py) nao depende
      # destas variaveis.
      #
      # Declaradas aqui, mesmo em branco, para aparecerem no painel do Render
      # esperando valor - nome de variavel que so existe no codigo e nome que
      # ninguem lembra na hora de configurar.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USUARIO
        sync: false
      - key: SMTP_SENHA
        sync: false
      # Nao e segredo: 587 negocia STARTTLS, 465 e TLS desde o inicio.
      - key: SMTP_PORT
        value: "587"

      # Quando o ERP estiver acessivel.
      - key: JACAD_MODO_MOCK
        value: "true"
      - key: JACAD_BASE_URL
        sync: false
      - key: JACAD_TOKEN
        sync: false
